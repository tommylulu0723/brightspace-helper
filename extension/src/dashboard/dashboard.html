<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程助手</title>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2.5z"/><path d="M8 7h6"/><path d="M8 11h4"/></svg></span>
      <span class="brand-name">课程助手</span>
    </div>
    <div class="tabs" role="tablist" aria-label="视图">
      <button id="tabDeadlines" class="tab" role="tab" type="button" aria-controls="viewDeadlines">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
        截止时间
      </button>
      <button id="tabUpdates" class="tab" role="tab" type="button" aria-controls="viewUpdates">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        动态<span id="unreadBadge" class="tab-badge" hidden></span>
      </button>
      <button id="tabMaterials" class="tab" role="tab" type="button" aria-controls="viewMaterials">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        课件库
      </button>
      <button id="tabGrades" class="tab" role="tab" type="button" aria-controls="viewGrades">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
        成绩
      </button>
    </div>
    <label class="search" id="searchBox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">搜索</span>
      <input id="q" type="search" placeholder="搜索…" autocomplete="off">
    </label>
    <button id="fbBtn" class="icon-btn theme-btn" type="button" title="反馈 / 报告问题" aria-label="反馈 / 报告问题">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/><path d="M12 8v4"/><path d="M12 15.5h.01"/></svg>
    </button>
    <button id="themeBtn" class="icon-btn theme-btn" type="button" aria-label="外观"></button>
    <div id="langMini" class="lang-mini" role="group" aria-label="Language" data-no-tr>
      <button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button>
    </div>
    <div class="sync">
      <span id="syncText" class="sync-text" aria-live="polite"></span>
      <button id="syncBtn" class="btn" type="button" title="从 Brightspace 同步">
        <svg id="syncIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
        <span>同步</span>
      </button>
      <button id="accountBtn" class="account-btn" type="button" aria-label="账号与设置"></button>
    </div>
  </div>
</header>

<div id="gate" class="gate" hidden></div>

<div class="wrap">
  <div id="banner" class="banner" role="status" hidden></div>
  <div id="announce" class="banner info" role="status" hidden></div>

  <div class="layout">
    <nav class="side" id="side" aria-label="课程">
      <div id="hello" class="hello"></div>
      <div class="side-title"><span>我的课程</span><button id="manageCourses" class="link-btn" type="button">管理</button></div>
      <div id="courseList" class="course-list"></div>
    </nav>

    <main class="main">
      <section id="viewDeadlines" role="tabpanel" aria-labelledby="tabDeadlines">
        <div class="page-head">
          <div>
            <h1>截止时间</h1>
            <p id="subtitle" class="subtitle"></p>
          </div>
          <div class="head-actions">
          <button id="addBtn" class="btn primary" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            添加截止
          </button>
          <button id="icsBtn" class="btn" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            导出到日历
          </button>
          </div>
        </div>
        <div id="planBox"></div>
        <div id="weekBox"></div>
        <div class="stats">
          <div class="stat"><span class="stat-label">未完成</span><span id="statOpen" class="stat-num">–</span></div>
          <div class="stat"><span class="stat-label">7 天内到期</span><span id="statSoon" class="stat-num warn">–</span></div>
          <div class="stat"><span class="stat-label">确认逾期</span><span id="statOverdue" class="stat-num danger">–</span></div>
          <div class="stat"><span class="stat-label">待你确认</span><span id="statUnverified" class="stat-num muted-num">–</span></div>
        </div>
        <div class="filters">
          <div id="typeChips" class="seg" role="group" aria-label="按类型筛选"></div>
          <label class="toggle">
            <input id="hideDone" type="checkbox">
            <span class="track" aria-hidden="true"><span class="knob"></span></span>
            隐藏已完成
          </label>
        </div>
        <div id="groups" class="groups"></div>
      </section>

      <section id="viewUpdates" role="tabpanel" aria-labelledby="tabUpdates" hidden>
        <div class="page-head">
          <div>
            <h1>动态</h1>
            <p id="updSubtitle" class="subtitle"></p>
          </div>
        </div>
        <div class="filters"><div id="updChips" class="seg" role="group" aria-label="按类型筛选"></div></div>
        <div id="updList" class="feed"></div>
      </section>

      <section id="viewMaterials" role="tabpanel" aria-labelledby="tabMaterials" hidden>
        <div class="page-head">
          <div>
            <h1 id="matTitle">课件库</h1>
            <p id="matSubtitle" class="subtitle"></p>
          </div>
          <div class="head-actions">
            <label class="toggle">
              <input id="lectureOnly" type="checkbox">
              <span class="track" aria-hidden="true"><span class="knob"></span></span>
              只看讲义
            </label>
            <button id="matRefresh" class="btn" type="button">重新读取课件</button>
            <button id="matDownloadAll" class="btn primary" type="button" hidden></button>
          </div>
        </div>
        <div id="materials" class="materials"></div>
      </section>

      <section id="viewGrades" role="tabpanel" aria-labelledby="tabGrades" hidden>
        <div class="page-head">
          <div>
            <h1 id="grTitle">成绩</h1>
            <p id="grSubtitle" class="subtitle"></p>
          </div>
        </div>
        <div id="grades" class="grades"></div>
      </section>

      <section id="viewSettings" hidden>
        <div class="page-head"><div><h1>设置</h1><p class="subtitle">课程管理、通知和账号</p></div></div>
        <div id="settingsRoot" class="settings-grid"></div>
      </section>
    </main>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="dashboard.js"></script>
</body>
</html>
