<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>课程助手</title>
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="ph">
  <span class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2.5z"/><path d="M8 7h6"/><path d="M8 11h4"/></svg></span>
  <div class="ph-text">
    <strong>课程助手</strong>
    <span id="syncText" class="muted" aria-live="polite"></span>
  </div>
  <button id="syncBtn" class="icon-btn" type="button" aria-label="立即同步">
    <svg id="syncIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
  </button>
</header>
<div id="gateBox" class="gate-box"></div>
<div id="banner" class="pbanner" hidden></div>
<div id="summary" class="summary"></div>
<button id="updatesBtn" class="updates-btn" type="button" hidden></button>
<div id="listTitle" class="list-title" hidden></div>
<ul id="list" class="plist"></ul>
<footer class="pf">
  <button id="openBtn" class="btn primary" type="button">打开完整汇总</button>
  <button id="matBtn" class="btn" type="button">课件库</button>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
